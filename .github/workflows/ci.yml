name: QuickDrop CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run offline, financial, security, and provider tests
        run: python -m pytest -q
      - name: Validate evaluator entry point
        run: python -m evals.run --help

  container_build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build-only Compose environment
        run: cp .env.example .env
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build all application images
        run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated local secrets
        shell: bash
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path

          postgres = secrets.token_hex(20)
          app_password = secrets.token_hex(20)
          seed_password = secrets.token_hex(20)
          fields = {
              "POSTGRES_PASSWORD": postgres,
              "APP_DATABASE_PASSWORD": app_password,
              "SEED_DATABASE_PASSWORD": seed_password,
              "DATABASE_URL": f"postgresql+asyncpg://quickdrop_app:{app_password}@db:5432/quickdrop",
              "SESSION_SECRET": secrets.token_hex(40),
              "WEBHOOK_TOKEN": secrets.token_hex(32),
              "MOCKPAYSWIFT_API_KEY": secrets.token_hex(32),
              "MOCKPAYSWIFT_TEST_TOKEN": secrets.token_hex(32),
              "MOCKPAYSWIFT_URL": "http://mockpayswift:8001",
              "MOCKPAYSWIFT_DATABASE_PATH": "/data/mockpayswift.sqlite3",
              "MOCKPAYSWIFT_TEST_MODE": "true",
              "QUICKDROP_TEST_MODE": "true",
              "DEMO_RIDER_PASSWORD": secrets.token_urlsafe(24),
              "DEMO_EMPLOYEE_PASSWORD": secrets.token_urlsafe(24),
              "AGENT_MODE": "offline",
              "GEMINI_API_KEY": "",
          }
          Path('.env').write_text(
              ''.join(f'{key}={value}\n' for key, value in fields.items()),
              encoding='utf-8',
          )
          PY
      - name: Start the local stack
        run: docker compose up --build --wait -d
      - name: Seed synthetic records
        run: docker compose run --rm -T seed
      - name: Run HTTP golden evaluation
        run: >-
          docker compose exec -T app python -m evals.run
          --base-url http://app:8000
          --provider-url http://mockpayswift:8001
          --reset-fixtures
          --output /tmp/latest.json
      - name: Verify human approval and duplicate blocking
        run: >-
          docker compose exec -T app python -m scripts.smoke_approval
          --base-url http://app:8000
          --provider-url http://mockpayswift:8001
      - name: Verify rider browser forms
        run: >-
          docker compose exec -T app python -m scripts.smoke_rider
          --base-url http://app:8000
      - name: Reset synthetic workflow fixtures for concurrent claims
        run: >-
          docker compose exec -T app python -c
          "import httpx; from app.config import get_settings; s=get_settings();
          r=httpx.post('http://app:8000/test/reset-fixtures',
          headers={'Authorization':'Bearer '+s.webhook_token,
          'X-Test-Token':s.mockpayswift_test_token}, timeout=60);
          r.raise_for_status()"
      - name: Verify concurrent claim payment gate
        run: docker compose exec -T app python -m scripts.smoke_concurrent_claims
      - name: Copy evaluation report
        if: always()
        run: docker compose exec -T app cat /tmp/latest.json > eval-results.json || true
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-evaluation
          path: eval-results.json
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the test stack
        if: always()
        run: docker compose down -v
